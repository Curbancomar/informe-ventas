<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Informe privado</title>
<meta name="description" content="Contenido privado. Se abre con clave.">
<style>
:root { --bg:#f4f5f7; --panel:#ffffff; --text:#1c2430; --muted:#5b6573; --line:#d5dae1; --accent:#283b56; --error:#b3261e; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#15191f; --panel:#1e242c; --text:#e7eaee; --muted:#9aa4b1; --line:#333c47; --accent:#8fb0dc; --error:#f2a19b; }
}
:root[data-theme="dark"] { --bg:#15191f; --panel:#1e242c; --text:#e7eaee; --muted:#9aa4b1; --line:#333c47; --accent:#8fb0dc; --error:#f2a19b; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
  background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
form { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:28px 24px; }
h1 { font-size:1.15rem; margin:0 0 4px; }
p { margin:0 0 20px; color:var(--muted); font-size:.92rem; }
label { display:block; font-size:.85rem; margin-bottom:6px; }
input { width:100%; padding:10px 12px; font:inherit; font-family:ui-monospace,Consolas,monospace; color:var(--text);
  background:var(--bg); border:1px solid var(--line); border-radius:6px; }
input:focus { outline:2px solid var(--accent); outline-offset:1px; }
button { margin-top:14px; width:100%; padding:10px; font:inherit; font-weight:600; border:0; border-radius:6px;
  background:var(--accent); color:var(--panel); cursor:pointer; }
button:disabled { opacity:.6; cursor:wait; }
#error { min-height:1.4em; margin:10px 0 0; color:var(--error); font-size:.88rem; }
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>Informe privado</h1>
  <p>El contenido está cifrado. Se abre con la clave que te pasaron aparte.</p>

  <input id="clave" type="password" autocomplete="current-password" spellcheck="false" autofocus required>
  <button id="b" type="submit">Abrir</button>
  <div id="error" role="alert"></div>
</form>

const GUARDADA = 'informe-clave';
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function descifrar(clave) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  const k = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const txt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, k, b64(P.c));
  return JSON.parse(new TextDecoder().decode(txt));
}

function mostrar(d) {
  window.__adjuntos = d.adjuntos || {};
  document.open();
  document.write(d.html);
  document.close();
}

// Lo usa la portada: descarga un adjunto que viajaba cifrado
window.descargarAdjunto = nombre => {
  const t = (window.__adjuntos || {})[nombre];
  if (t == null) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' }));
  a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove();
};

async function intentar(clave, silencioso) {
  const b = document.getElementById('b'), e = document.getElementById('error');
  b.disabled = true; b.textContent = 'Abriendo…'; e.textContent = '';
  try {
    const d = await descifrar(clave);
    try { sessionStorage.setItem(GUARDADA, clave); } catch (_) {}
    mostrar(d);
  } catch (_) {
    try { sessionStorage.removeItem(GUARDADA); } catch (_) {}
    b.disabled = false; b.textContent = 'Abrir';
    if (!silencioso) e.textContent = 'La clave no es correcta.';
  }
}

document.getElementById('f').addEventListener('submit', ev => {
  ev.preventDefault();
  intentar(document.getElementById('clave').value.trim(), false);
});

let previa = null;
try { previa = sessionStorage.getItem(GUARDADA); } catch (_) {}
if (previa) intentar(previa, true);
})();
